<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MT Assistant</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #070d15;
        color: #edf6ff;
        font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .wrap {
        text-align: center;
        padding: 24px;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      p {
        margin: 0;
        opacity: 0.72;
        font-size: 15px;
      }
      .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin: 18px 3px 0;
        border-radius: 50%;
        background: #5e8eb5;
        animation: pulse 1.1s infinite ease-in-out;
      }
      .dot:nth-child(2) {
        animation-delay: 0.15s;
      }
      .dot:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes pulse {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img id="logo" alt="MT Assistant" src="./icon.png" />
      <h1>MT Assistant</h1>
      <p>載入中…</p>
      <div>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </div>
    <script>
      document.getElementById("logo").onerror = function () {
        this.style.display = "none";
      };
    </script>
  </body>
</html>
